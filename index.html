const SC={
intro:`## 1. Introduction – What are we really buying?
Hi, everyone!
Let me start with a simple question: How many clothes do you have in your closet that you never wear?
Maybe you bought them because they were on sale, because they were trendy, or because you saw them on TikTok.
And that's okay. We all like buying new clothes. Sometimes we just want to look good, try a new style, or feel different.
But have you ever stopped to think about what happens before those clothes arrive at your home?
Today, I want to talk about Fast Fashion and how our way of buying clothes affects the planet and the people who make them.
Because, at the end of the day, a cheap T-shirt may have a much bigger cost than we think.`,
ff1:`## 2. What is Fast Fashion?
First things first, what does Fast Fashion mean?
Fast Fashion is a way of making and selling clothes very quickly and at low prices.
Companies bring out new clothes all the time. They follow trends, copy popular styles, and try to sell as much as possible.
For example, you can open an app like SHEIN and find hundreds of new clothes every day.`,
ff2:`## 2. What is Fast Fashion? (cont.)
And here's the thing: trends come and go very quickly. One week, something is popular. The next week, nobody wants it anymore.
So, people keep buying more and more clothes, but they don't always wear them for a long time.
In other words, clothes are made to be bought quickly, used for a short time, and then thrown away.
This leads to a big problem: overproduction. That means companies make more clothes than people really need.
And let's face it, we don't need a new outfit every single week!`,
labour:`## 3. The people behind our clothes
But there's another side of Fast Fashion that we don't always see.
Before a T-shirt gets to a store or to our homes, someone has to make it.
Many workers in the clothing industry work long hours and get very low pay. In some places, they even face unsafe conditions.
And sadly, child labour is still a problem.
For example, in 2024, SHEIN reported that it found two cases of child labour among its suppliers. One of the children was only 11 years old.
This doesn't mean that every person who works with SHEIN is a child, but it shows that serious problems can happen inside these supply chains.
And here's the million-dollar question:
Who pays the real price for our cheap clothes?
Because sometimes, while we save money, other people have to work in very difficult conditions.
And that's not fair, is it?`,
env:`## 4. The environmental impact
Now, let's talk about the planet.
Making clothes takes a lot of water, energy, and other resources.
For example, making one pair of jeans can use around 7,500 litres of water. That's a lot of water for just one pair of jeans!
Also, factories use chemicals to make clothes in different colours. Some of these chemicals can pollute rivers and affect people, animals, and nature.
On top of that, making and moving clothes around the world creates pollution.
And what happens when we don't want those clothes anymore?
A lot of them end up in the trash. Some are burned, and others are left in places where they can damage the environment.
We often hear people talk about the environmental impact of AI and data centres. And yes, that's a big issue too.
But here's what I find interesting: we talk a lot about new technology, but sometimes we forget about industries like fashion, which have been affecting the planet for years.
Don't get me wrong, AI's impact is important. But we shouldn't turn a blind eye to the problems caused by the fashion industry either.
The point is not to say that one is worse than the other. The point is that we should talk about both.`,
atacama:`## 5. The Atacama Desert – A mountain of clothes
One of the clearest examples of this problem is in Chile, in the Atacama Desert.
There are huge piles of unwanted clothes in this area. Some of these clothes come from other countries and arrive in Chile to be sold as second-hand clothing.
But not everything can be sold or reused. So, a lot of it is left in the desert, and some of it is burned.
Just think about that for a second.
We buy clothes, wear them a few times, and forget about them. But they don't just disappear when we throw them away.
They have to go somewhere.
And in places like the Atacama Desert, we can see what happens when people and companies produce and throw away too much.
It's important to point out that this waste doesn't come only from SHEIN. It's part of a much bigger problem with the clothing industry and the way we buy and throw away clothes.`,
resp:`## 6. Who is really responsible?
Now, I want to talk about something important.
I don't think we should point fingers at people just because they buy cheap clothes.
Not everyone has enough money to buy expensive brands. Sometimes, affordable clothes are the only option.
And let's be honest: a high price doesn't always mean that a product is ethical or good for the planet.
Sometimes, we're also paying for the brand, the name, the marketing, or the design.
So, the problem isn't simply that people want to buy affordable clothes.
The bigger problem is a system where companies make too many clothes, follow every trend, and encourage people to keep buying.
Companies have a big responsibility because they decide how many clothes they make, where they make them, and who works in their factories.
Governments also need to step up and create rules to protect workers and the environment.
Of course, we can make better choices as consumers. But let's not forget that we can't fix the whole problem on our own.`,
sol:`## 7. What can we do?
So, what can we do?
First, we can think twice before buying something. Do we really need it, or do we just want it because it's trendy?
Second, we can take care of the clothes we already have. We can reuse them, fix them, or give them to someone else.
We can also look for second-hand clothes when possible.
And finally, we can speak up and ask companies to be more responsible and honest about how they make their clothes.
These actions may seem small, but every little bit helps.
After all, change doesn't happen overnight.`,
concl:`## Conclusion
To wrap things up, I want you to remember one thing:
Fast Fashion is not just about clothes. It's also about workers, pollution, waste, and the future of our planet.
We don't need to stop buying clothes completely. We just need to understand what goes on behind the things we buy.
Because every time we buy something, there's a story behind it.
And maybe it's time to hit the brakes, think twice, and stop following every single trend.
At the end of the day, the planet is our home, and we don't have a backup!
Thank you for listening!`

const vid=d=>`<section class="vd"><div class="tx"><div class="eb">${d.eb}</div><h2 class="hd vh">${hd(d.hd)}</h2></div><div class="fr"><iframe src="https://www.youtube-nocookie.com/embed/${d.v}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video"></iframe></div></section>`;
let idx=0,tr=null;
ui.addEventListener('click',e=>{if(e.target.closest('.fr'))e.stopPropagation();});
function render(){const d=S[idx];document.body.classList.toggle('vid',!!d.v);
 if(d.v)ui.innerHTML=vid(d);else{
  const flow=d.flow?`<div class="flow">${d.flow.map((x,i)=>`<div class="fb${i==d.flow.length-1?' l':''}"><small>0${i+1}</small><b>${x}</b></div>${i<d.flow.length-1?'<span class="ar">→</span>':''}`).join('')}</div>`:'';
  const stat=d.stat?`<div class="stat"><b${d.stat.r?' class="r"':''}>${d.stat.n}</b><span>${d.stat.u}</span></div>`:'';
  const vs=d.vs?`<div class="vs">${d.vs.map(c=>`<div class="vc" style="--c:${c.c}"><small>${c.l}</small><h3>${c.t}</h3><em>${c.p}</em></div>`).join('<span class="vv">VS</span>')}</div>`:'';
  const chips=d.chips?`<div class="chips">${d.chips.map((c,i)=>`<span class="chip${c[0]=='!'?' r':''}" style="--i:${i}">${c.replace('!','')}</span>`).join('')}</div>`:'';
  const H=d.cv?'h1':'h2';
  const tx=`<div class="tx"><div class="eb">${d.eb}</div><${H} class="hd${d.cv?' cv':''}${d.big?' big':''}">${hd(d.hd)}</${H}>${d.sub?`<i class="ln"></i><div class="sub">${d.sub}</div>`:''}${stat}${flow}${vs}${chips}</div>`;
  ui.innerHTML=`<section class="${d.img?(d.lay||'L'):'solo'}">${tx}${d.img?`<div class="cw"><figure class="card"><img src="${imgSrc(d.img)}" alt=""></figure></div>`:''}</section>`;}
 upd();cnt.innerHTML=`<b>${idx+1}</b><s>/</s>${S.length}`;bar.style.width=((idx+1)/S.length*100)+'%';pv.disabled=idx==0;nx.disabled=idx==S.length-1;}

const sp=document.getElementById('sp'),spb=document.getElementById('spb'),spn=document.getElementById('spn'),sbt=document.getElementById('sbt');
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function upd(){const d=S[idx];spn.textContent=`SLIDE ${idx+1}`;spb.scrollTop=0;
 spb.innerHTML=d.sc?d.sc.split('\n').map(l=>l.startsWith('## ')?`<h4>${esc(l.slice(3))}</h4>`:`<p>${esc(l)}</p>`).join(''):'<p class="em">Esta diapositiva no tiene guion en tu diálogo.</p>';}
const tgl=()=>{sp.classList.toggle('on');document.body.classList.toggle('spo',sp.classList.contains('on'));sbt.classList.toggle('on',sp.classList.contains('on'));};
sbt.onclick=tgl;document.getElementById('spx').onclick=tgl;
addEventListener('keydown',e=>{if(e.key=='s'||e.key=='S')tgl();});
pv.onclick=()=>go(idx-1);nx.onclick=()=>go(idx+1);
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
function go(n){n=Math.max(0,Math.min(S.length-1,n));if(n===idx||tr)return;tr={t0:performance.now(),n,sw:0};ui.classList.add('out');}
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown','Enter'].includes(e.key))go(idx+1);else if(['ArrowLeft','PageUp','Backspace'].includes(e.key))go(idx-1);else if(e.key=='Home')go(0);else if(e.key=='End')go(S.length-1);else if(e.key=='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();});
addEventListener('click',e=>{if(e.target.closest('.chrome'))return;go(idx+(e.clientX>innerWidth*.3?1:-1));});
let sx=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(idx+(d<0?1:-1));});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const VS=`attribute vec2 p;varying vec2 sc;void main(){sc=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;varying vec2 sc;
uniform sampler2D uTex;uniform float uT,uA,uGl;uniform vec2 uRes;uniform vec3 uZ;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<3;i++){v+=a*n(p);p*=2.03;a*=.5;}return v/.875;}
void main(){
 float ra=uRes.x/uRes.y;vec2 s=vec2(1.);if(ra>uA)s.y=uA/ra;else s.x=ra/uA;
 vec2 uv=(sc-.5)*s+.5;
 float z=uZ.x*(1.+.02*sin(uT*.2));uv=(uv-uZ.yz)/z+uZ.yz;
 uv.x+=(h(vec2(floor(uv.y*26.),floor(uT*20.)))-.5)*uGl*.12;
 vec2 pp=(uv-vec2(.5,.76))/vec2(.36,.40);
 float m=1.-smoothstep(.55,1.05,length(pp));m=max(m,smoothstep(.80,.93,uv.y)*.85);
 m*=1.-.92*(1.-smoothstep(.6,1.2,length((uv-vec2(.503,.87))/vec2(.025,.11))));
 float t=uT;float gust=.7+.3*sin(t*.55+uv.x*2.5)+.2*sin(t*1.3);
 vec2 q=uv*vec2(8.,11.);
 float n1=fbm(q+vec2(-t*.6,t*.12));float n2=fbm(q*1.7+vec2(-t*.9+31.,-t*.2));
 vec2 d=vec2(n1-.5,(n2-.5)*.55)*.032*gust*m;
 d.x+=sin(uv.y*60.+t*3.+n1*6.)*.0013*m*gust;
 d.x+=(fbm(uv*vec2(3.,6.)+vec2(-t*.15,0.))-.5)*.006*(1.-m)*(1.-smoothstep(.5,.68,uv.y));
 vec3 c=texture2D(uTex,clamp(uv+d,0.,1.)).rgb;
 c*=1.+(n1-.5)*.4*m;
 c*=1.-uGl*.4;
 c*=1.-.9*dot(sc-.5,sc-.5);
 c+=(h(sc*uRes+floor(t*14.))-.5)*.06;
 gl_FragColor=vec4(c,1.);}`;
const bgi=new Image();bgi.onload=()=>{
 const gl=document.getElementById('gl'),fx=document.getElementById('fx'),ctx=fx.getContext('2d');
 const g=gl.getContext('webgl');render();if(!g)return;
 const sh=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);return o;};
 const pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,VS));g.attachShader(pr,sh(g.FRAGMENT_SHADER,FS));g.linkProgram(pr);g.useProgram(pr);
 g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer());g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
 const lc=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(lc);g.vertexAttribPointer(lc,2,g.FLOAT,false,0,0);
 const tx=g.createTexture();g.bindTexture(g.TEXTURE_2D,tx);g.texImage2D(g.TEXTURE_2D,0,g.RGB,g.RGB,g.UNSIGNED_BYTE,bgi);
 [[g.TEXTURE_MIN_FILTER,g.LINEAR],[g.TEXTURE_MAG_FILTER,g.LINEAR],[g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE],[g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE]].forEach(a=>g.texParameteri(g.TEXTURE_2D,a[0],a[1]));
 const U=k=>g.getUniformLocation(pr,k);g.uniform1f(U('uA'),bgi.width/bgi.height);
 let W,H;function size(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;gl.width=fx.width=Math.round(W*r);gl.height=fx.height=Math.round(H*r);g.viewport(0,0,gl.width,gl.height);g.uniform2f(U('uRes'),gl.width,gl.height);ctx.setTransform(r,0,0,r,0,0);}
 addEventListener('resize',size);size();
 const cols=['#14172b','#1d2a3c','#e9d9d6','#f4b9bf','#8d1228','#ff4a63'];
 const fl=Array.from({length:reduce?0:60},()=>({x:Math.random(),y:.2+Math.random()*.75,v:.03+Math.random()*.09,s:2+Math.random()*4,p:Math.random()*9,r:Math.random()*6,c:cols[Math.random()*6|0]}));
 let last=performance.now(),cz=S[0].z.slice();
 function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;const t=reduce?3:now/1000;
  let gG=0;
  if(tr){const p=(now-tr.t0)/900;if(p<.35)gG=p/.35;else{if(!tr.sw){tr.sw=1;idx=tr.n;render();ui.classList.remove('out');}gG=Math.max(0,1-(p-.35)/.65);}if(p>=1)tr=null;}
  const k=Math.min(1,dt*2.2),tg=S[idx].z;for(let i=0;i<3;i++)cz[i]+=(tg[i]-cz[i])*k;
  g.uniform1f(U('uT'),t);g.uniform1f(U('uGl'),gG);g.uniform3f(U('uZ'),cz[0],cz[1],cz[2]);
  g.drawArrays(g.TRIANGLE_STRIP,0,4);
  ctx.clearRect(0,0,W,H);const gu=.8+.4*Math.sin(t*.55);
  for(const f of fl){f.x+=f.v*gu*dt;f.p+=dt;f.r+=dt*(1+f.v*8);if(f.x>1.05){f.x=-.05;f.y=.2+Math.random()*.75;}
   ctx.fillStyle=f.c;ctx.beginPath();ctx.ellipse(f.x*W,(f.y+Math.sin(f.p*1.3+f.x*6)*.03)*H,f.s*1.8,f.s*.7*Math.abs(Math.cos(f.r))+.4,f.r,0,6.283);ctx.fill();}
  requestAnimationFrame(frame);}
 requestAnimationFrame(frame);
};
bgi.src=BG;
</script></body></html>
